name: CI
on:
  push:
  pull_request:
  workflow_call: # reused by release.yml as the gate before publishing
    inputs:
      ref:
        description: Commit to test (defaults to the triggering commit)
        type: string
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install Jammy dependencies (apt only, as on a user machine)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            libadwaita-1-0 gir1.2-glib-2.0 policykit-1 desktop-file-utils appstream \
            python3-pytest xvfb dbus gettext dpkg-dev debhelper dh-python lintian
          pipx install ruff
      - name: Toolkit versions
        run: python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; print(Gtk.get_major_version(), Gtk.get_minor_version(), Adw.get_major_version(), Adw.get_minor_version())"
      - name: Lint
        run: |
          ruff check headroom tests scripts helper/headroom-helper
          desktop-file-validate data/io.github.kdcllc.Headroom.desktop
          appstreamcli validate --no-net data/io.github.kdcllc.Headroom.metainfo.xml
      - name: Unit tests
        run: /usr/bin/python3 -m pytest tests --ignore=tests/ui -q
      - name: GUI smoke tests
        timeout-minutes: 5 # they take seconds; a hang should fail fast, not burn the 6h default
        # isolated session bus with nothing activatable + no a11y bridge: Adw/GTK startup otherwise
        # blocks on xdg-desktop-portal / at-spi D-Bus calls on headless runners
        # faulthandler_timeout dumps every thread's stack if a test stalls, so the log shows where
        run: >-
          dbus-run-session --config-file=tests/ui/dbus-session.conf -- xvfb-run -a -s "-screen 0 1280x900x24"
          env GDK_BACKEND=x11 GTK_A11Y=none NO_AT_BRIDGE=1
          /usr/bin/python3 -m pytest tests/ui -v -o faulthandler_timeout=60
      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../headroom_*_all.deb dist/
          lintian --fail-on error --info dist/*.deb  # warnings are shown, errors fail the build
      - uses: actions/upload-artifact@v4
        with:
          name: headroom-deb
          path: dist/*.deb
